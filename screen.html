<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Current Flight</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root { --cyan:#4de2e6; --muted:#b4c4d3; --panel:rgba(10,20,34,.86); --border:rgba(173,204,230,.18); }
    * { box-sizing:border-box; }
    body { margin:0; width:100vw; height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#03080f; color:#fff; font-family:"Lexend Deca",system-ui,sans-serif; }
    #bg-overlay { position:fixed; inset:0; background-size:cover; background-position:center; background-repeat:no-repeat; opacity:.48; transform:scale(1.02); transition:background-image .8s ease, opacity .5s ease; z-index:-2; overflow:hidden; }
    #bg-overlay.clear-day {
      background-image:url('/logo/screen/day-sky.jpg');
      background-size:cover;
      background-position:center center;
      opacity:1;
    }
    #bg-overlay.clear-night {
      background-image:url('/logo/screen/night-sky.jpg');
      background-size:cover;
      background-position:center center;
      opacity:1;
    }
    body::before { content:""; position:fixed; inset:0; background:linear-gradient(180deg,rgba(2,7,13,.18),rgba(2,7,13,.48)); z-index:-1; }
    .stage { width:min(980px,92vw); display:flex; flex-direction:column; align-items:center; gap:20px; }
    .card { width:100%; background:linear-gradient(145deg,var(--panel),rgba(9,17,29,.9)); border:1px solid var(--border); border-radius:24px; box-shadow:0 24px 70px rgba(0,0,0,.45); backdrop-filter:blur(10px); text-align:center; }
    #activeCard { padding:42px 58px; transition:opacity .35s ease, transform .35s ease; }
    .route-row { display:flex; justify-content:space-between; align-items:center; gap:24px; margin:20px 0; }
    .origin,.destination { width:40%; display:flex; flex-direction:column; align-items:center; }
    .airport-code { font-size:clamp(3rem,7vw,5rem); font-weight:700; line-height:.95; letter-spacing:-.05em; }
    .airport-location { margin-top:10px; font-size:clamp(1rem,2.3vw,1.7rem); color:#c1d0dc; line-height:1.25; }
    .arrow { color:var(--cyan); font-size:clamp(3rem,7vw,5rem); flex:0 0 auto; }
    .flight { color:var(--cyan); font-size:clamp(1.15rem,2.5vw,1.7rem); font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .airline { font-size:clamp(1.5rem,3vw,2.5rem); color:#e6f0f7; font-weight:600; display:flex; align-items:center; justify-content:center; gap:12px; min-height:50px; }
    .airline img { max-height:46px; max-width:150px; object-fit:contain; }
    .type { margin-top:9px; font-size:clamp(1rem,2vw,1.55rem); color:#aebdca; }
    .seen { margin-top:10px; font-size:.76rem; color:#7f94a7; text-transform:uppercase; letter-spacing:.08em; }
    #clearState { width:100%; display:none; text-align:center; }
    .clear-title { font-family:"Great Vibes",cursive; font-size:clamp(4.4rem,10vw,8rem); margin:0 0 -4px; letter-spacing:0; font-weight:400; line-height:1; color:rgba(255,255,255,.92); text-shadow:0 3px 24px rgba(0,0,0,.38); }
    .last-card { width:min(620px,84vw); margin:0 auto; padding:15px 18px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:15px; text-align:left; background:rgba(5,12,21,.28); border-color:rgba(255,255,255,.11); border-radius:18px; box-shadow:0 12px 38px rgba(0,0,0,.18); backdrop-filter:blur(7px); }
    .last-label { color:rgba(224,236,246,.5); font-size:.58rem; text-transform:uppercase; letter-spacing:.14em; margin-bottom:4px; }
    .last-flight { color:rgba(255,255,255,.86); font-weight:600; font-size:.9rem; }
    .last-route { color:rgba(237,246,252,.74); font-size:.82rem; }
    .last-meta { color:rgba(217,232,243,.48); font-size:.66rem; margin-top:3px; }
    .last-logo img { max-height:28px; max-width:86px; object-fit:contain; opacity:.76; }
    .last-time { color:rgba(217,232,243,.46); font-size:.64rem; white-space:nowrap; text-align:right; }
    #homeHotspot { position:fixed; right:0; bottom:0; width:90px; height:90px; cursor:pointer; z-index:20; background:transparent; border:0; padding:0; }
    #homeHotspot:focus-visible { outline:2px solid var(--cyan); outline-offset:-8px; border-radius:16px; }
    @media (max-width:700px) { #activeCard{padding:30px 22px}.route-row{gap:10px}.last-card{grid-template-columns:1fr}.last-time{text-align:left}.last-logo{display:none;} }
  </style>
</head>
<body>
  <div id="bg-overlay"></div>
  <main class="stage">
    <section id="activeCard" class="card" aria-live="polite">
      <div id="flightNo" class="flight">Waiting for aircraft…</div>
      <div class="route-row">
        <div id="origin" class="origin"></div>
        <div class="arrow">→</div>
        <div id="destination" class="destination"></div>
      </div>
      <div id="airline" class="airline"></div>
      <div id="type" class="type"></div>
      <div id="seen" class="seen"></div>
    </section>

    <section id="clearState" aria-live="polite">
      <h1 class="clear-title">Clear Skies</h1>
      <div class="card last-card">
        <div id="lastLogo" class="last-logo"></div>
        <div>
          <div class="last-label">Last flight</div>
          <div id="lastFlight" class="last-flight">None yet</div>
          <div id="lastRoute" class="last-route"></div>
          <div id="lastMeta" class="last-meta"></div>
        </div>
        <div id="lastTime" class="last-time"></div>
      </div>
    </section>
  </main>
  <button id="homeHotspot" aria-label="Return to live radar" title=""></button>
  <script src="screen.js"></script>
</body>
</html>
