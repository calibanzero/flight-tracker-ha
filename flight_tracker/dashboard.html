<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Analytics Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg:#07111f; --panel:rgba(14,27,45,.92); --border:rgba(148,184,220,.15);
      --text:#edf6ff; --muted:#98acc2; --cyan:#4de2e6; --shadow:0 22px 60px rgba(0,0,0,.32);
    }
    * { box-sizing:border-box; }
    html { color-scheme:dark; }
    body {
      margin:0; min-height:100vh; color:var(--text); font-family:"Lexend Deca",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:radial-gradient(circle at 15% 0%,rgba(77,226,230,.12),transparent 32rem),
                 radial-gradient(circle at 90% 15%,rgba(105,167,255,.13),transparent 34rem),
                 linear-gradient(155deg,#050b14 0%,var(--bg) 55%,#0a1727 100%);
    }
    a { color:inherit; }
    .page { width:min(1460px,calc(100% - 32px)); margin:0 auto; padding:28px 0 48px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .brand { display:flex; align-items:center; gap:14px; min-width:0; }
    .radar-mark {
      width:48px; height:48px; border-radius:50%; position:relative; flex:0 0 auto;
      background:radial-gradient(circle,var(--cyan) 0 4px,transparent 5px),
                 radial-gradient(circle,transparent 0 11px,rgba(77,226,230,.45) 12px 13px,transparent 14px 21px,rgba(77,226,230,.22) 22px 23px,transparent 24px);
      border:1px solid rgba(77,226,230,.3); box-shadow:0 0 28px rgba(77,226,230,.14);
    }
    .radar-mark::after { content:""; position:absolute; width:21px; height:1px; left:24px; top:24px; transform-origin:left center; transform:rotate(-34deg); background:linear-gradient(90deg,var(--cyan),transparent); }
    .brand h1 { margin:0; font-size:clamp(1.35rem,2vw,2rem); letter-spacing:-.03em; }
    .brand p { margin:3px 0 0; color:var(--muted); font-size:.85rem; }
    .nav { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; }
    .nav a { text-decoration:none; padding:9px 13px; border:1px solid var(--border); border-radius:11px; background:rgba(255,255,255,.035); color:#cfe1f5; font-size:.82rem; transition:transform .16s ease,border-color .16s ease,background .16s ease; }
    .nav a:hover { transform:translateY(-1px); border-color:rgba(77,226,230,.42); background:rgba(77,226,230,.07); }
    .nav a.primary { color:#041014; background:linear-gradient(135deg,var(--cyan),#7af0c9); border-color:transparent; font-weight:700; }
    .shell { width:100%; padding:24px; border-radius:22px; background:linear-gradient(145deg,var(--panel),rgba(10,20,34,.96)); border:1px solid var(--border); box-shadow:var(--shadow); }
    .filters {
      margin: 20px auto 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .filters label {
      font-size: 0.9rem;
      color: #c5c6c7;
    }

    .filters input[type="date"] {
      margin-left: 4px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #0b0c10;
      color: #fff;
      font-family: inherit;
    }

    .filters button {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      background: #45a29e;
      color: #0b0c10;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .filters button:hover {
      background: #66fcf1;
      transform: translateY(-1px);
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 8px;
    }

    @media (max-width: 900px) {
      .charts {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .card {
      border-radius: 16px;
      padding: 16px;
      background: rgba(11, 12, 16, 0.9);
      border: 1px solid #1f2833;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      font-weight: 500;
      color: #c5c6c7;
    }

    .card.full-width {
      grid-column: 1 / -1;
    }

    canvas {
      max-width: 100%;
      height: 260px;
    }

    @media (max-width:900px) {
      .topbar { align-items:flex-start; flex-direction:column; }
      .nav { justify-content:flex-start; }
      .page { width:min(100% - 20px,1460px); padding-top:16px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="radar-mark" aria-hidden="true"></div>
        <div><h1>Flight Analytics</h1><p>Historical traffic through the configured tracking area.</p></div>
      </div>
      <nav class="nav" aria-label="Flight tracker navigation">
        <a href="/">Live radar</a>
        <a href="/screen.html">Display view</a>
        <a class="primary" href="/dashboard">Analytics</a>
        <a href="/admin">Admin</a>
      </nav>
    </header>
    <div class="shell">

    <div class="filters">
      <label>From: <input type="date" id="fromDate"></label>
      <label>To: <input type="date" id="toDate"></label>
      <button id="applyDates">Apply</button>
    </div>

    <div class="charts">
    <div class="card">
      <h2>Busiest hours of the day</h2>
      <canvas id="byHourChart"></canvas>
    </div>
    <div class="card">
      <h2>Flights by aircraft type (Top 10)</h2>
      <canvas id="byAircraftChart"></canvas>
    </div>
    <div class="card full-width">
      <h2>Busiest 15-minute intervals</h2>
      <canvas id="byQuarterChart"></canvas>
    </div>
    <div class="card full-width">
      <h2>Flights per day</h2>
      <canvas id="byDayChart"></canvas>
    </div>
    <div class="card">
      <h2>Flights by airline (Top 10)</h2>
      <canvas id="byAirlineChart"></canvas>
    </div>
    </div>
    </div>
  </main>

  <script>
    function formatDateInput(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function buildQuarterLabels() {
      const labels = [];
      for (let i = 0; i < 96; i++) {
        const totalMinutes = i * 15;
        const h = Math.floor(totalMinutes / 60);
        const m = totalMinutes % 60;
        labels.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
      }
      return labels;
    }

    async function fetchStats(fromDate, toDate) {
      const params = new URLSearchParams();
      if (fromDate) params.set('from', fromDate);
      if (toDate) params.set('to', toDate);

      const qs = params.toString();
      const url = qs ? `/api/stats?${qs}` : '/api/stats';

      const res = await fetch(url);
      if (!res.ok) throw new Error('Failed to load stats');
      return res.json();
    }

    function topN(obj, n) {
      const entries = Object.entries(obj || {});
      entries.sort((a, b) => b[1] - a[1]);
      return entries.slice(0, n);
    }

    function buildCharts(data) {
      const hourLabels = Array.from({ length: 24 }, (_, h) =>
        `${String(h).padStart(2, '0')}:00`
      );

      const ctxHour = document.getElementById('byHourChart').getContext('2d');
      new Chart(ctxHour, {
        type: 'bar',
        data: {
          labels: hourLabels,
          datasets: [{
            label: 'Flights',
            data: data.byHour || []
          }]
        },
        options: {
          scales: {
            x: { title: { display: true, text: 'Hour of Day (server local time)' } },
            y: { title: { display: true, text: 'Number of flights' }, beginAtZero: true }
          }
        }
      });

      const quarterLabels = buildQuarterLabels();
      const ctxQuarter = document.getElementById('byQuarterChart').getContext('2d');
      new Chart(ctxQuarter, {
        type: 'bar',
        data: {
          labels: quarterLabels,
          datasets: [{
            label: 'Flights',
            data: data.byQuarterHour || []
          }]
        },
        options: {
          scales: {
            x: {
              title: { display: true, text: 'Time of Day (15-minute bins)' },
              ticks: {
                maxRotation: 0,
                minRotation: 0,
                autoSkip: true,
                maxTicksLimit: 16
              }
            },
            y: {
              title: { display: true, text: 'Number of flights' },
              beginAtZero: true
            }
          }
        }
      });

      const flightsPerDay = data.flightsPerDay || {};
      const dayEntries = Object.entries(flightsPerDay);
      dayEntries.sort((a, b) => a[0].localeCompare(b[0]));
      const dayLabels = dayEntries.map(([day]) => day);
      const dayValues = dayEntries.map(([, value]) => value);

      if (dayLabels.length > 0) {
        const ctxDay = document.getElementById('byDayChart').getContext('2d');
        new Chart(ctxDay, {
          type: 'bar',
          data: {
            labels: dayLabels,
            datasets: [{
              label: 'Flights',
              data: dayValues
            }]
          },
          options: {
            scales: {
              x: {
                title: { display: true, text: 'Date (Sydney time)' },
                ticks: {
                  autoSkip: true,
                  maxTicksLimit: 14
                }
              },
              y: {
                title: { display: true, text: 'Number of flights' },
                beginAtZero: true
              }
            }
          }
        });
      }

      const topTypes = topN(data.flightsByAircraft, 10);
      const ctxType = document.getElementById('byAircraftChart').getContext('2d');
      new Chart(ctxType, {
        type: 'bar',
        data: {
          labels: topTypes.map(([k]) => k),
          datasets: [{
            label: 'Flights',
            data: topTypes.map(([,v]) => v)
          }]
        },
        options: {
          indexAxis: 'y',
          scales: {
            x: { beginAtZero: true, title: { display: true, text: 'Number of flights' } }
          }
        }
      });

      const topAirlines = topN(data.flightsByAirline, 10);
      const ctxAirline = document.getElementById('byAirlineChart').getContext('2d');
      new Chart(ctxAirline, {
        type: 'bar',
        data: {
          labels: topAirlines.map(([k]) => k),
          datasets: [{
            label: 'Flights',
            data: topAirlines.map(([,v]) => v)
          }]
        },
        options: {
          indexAxis: 'y',
          scales: {
            x: { beginAtZero: true, title: { display: true, text: 'Number of flights' } }
          }
        }
      });
    }

    async function initDashboard() {
      const fromInput = document.getElementById('fromDate');
      const toInput = document.getElementById('toDate');
      const applyBtn = document.getElementById('applyDates');

      const today = new Date();
      const sevenDaysAgo = new Date(today);
      sevenDaysAgo.setDate(today.getDate() - 7);

      fromInput.value = formatDateInput(sevenDaysAgo);
      toInput.value = formatDateInput(today);

      async function load() {
        const data = await fetchStats(fromInput.value, toInput.value);
        buildCharts(data);
      }

      applyBtn.addEventListener('click', () => {
        load().catch(err => {
          console.error(err);
          alert('Failed to load stats – see console for details.');
        });
      });

      load().catch(err => {
        console.error(err);
        alert('Failed to load stats – see console for details.');
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initDashboard().catch(err => {
        console.error(err);
        alert('Failed to initialise dashboard.');
      });
    });
  </script>
</body>
</html>
