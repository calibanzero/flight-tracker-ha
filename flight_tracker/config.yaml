name: Flight Tracker
version: "1.0.1"
slug: flight_tracker
description: Live aircraft tracker using OpenSky for positions and ADSBDB for aircraft and route data.
startup: application
init: false
arch:
  - aarch64
  - amd64
ports:
  3002/tcp: 3002
ports_description:
  3002/tcp: Flight Tracker web interface
webui: http://[HOST]:[PORT:3002]
watchdog: http://[HOST]:[PORT:3002]/api/health
stage: experimental
